<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historique des incidents - Supervision Équipements</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4">Historique des incidents résolus</h2>

    <div th:if="${#lists.isEmpty(incidents)}" class="alert alert-info">Aucun incident résolu pour le moment.</div>

    <table th:unless="${#lists.isEmpty(incidents)}" class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Résolu le</th>
            <th>Description</th>
            <th>Équipement</th>
            <th>Station</th>
            <th>Prestataire</th>
            <th>Ouvert le</th>
            <th>Note</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="incident : ${incidents}">
            <td th:text="${#temporals.format(incident.dateHeureResolution, 'dd/MM/yyyy HH:mm')}">03/01/2026 13:10</td>
            <td><a th:href="@{/incidents/{id}(id=${incident.id})}" th:text="${incident.description}">Description de la panne</a></td>
            <td th:text="${incident.equipement.reference}">EQ-001</td>
            <td th:text="${incident.equipement.station.nom}">Station</td>
            <td th:text="${incident.prestataire?.nom}">Prestataire</td>
            <td th:text="${#temporals.format(incident.dateHeureOuverture, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
            <td th:text="${notesParIncident[incident.id] != null ? notesParIncident[incident.id] + ' / 5' : 'Non évalué'}">5 / 5</td>
        </tr>
        </tbody>
    </table>

    <a th:unless="${#lists.isEmpty(incidents)}" th:href="@{/incidents/historique/export}" class="btn btn-primary mt-3">Exporter en CSV</a>
    <a th:href="@{/accueil}" class="btn btn-secondary mt-3">Retour à l'accueil</a>
</div>

</body>
</html>
