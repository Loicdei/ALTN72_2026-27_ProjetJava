<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erreur - Supervision Équipements</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{header :: header}"></div>

<div class="container mt-5">
    <div class="alert alert-danger" role="alert"
         th:text="${messageErreur} ?: 'Une erreur est survenue. Merci de réessayer.'">
        Message d'erreur
    </div>
    <a th:href="@{/accueil}" class="btn btn-secondary">Retour à l'accueil</a>
</div>

</body>
</html>
