<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Statistiques - Supervision Équipements</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4">Statistiques des incidents</h2>

    <div class="row g-4">
        <div class="col-12">
            <div class="card h-100">
                <div class="card-header fw-bold">Incidents ouverts par jour (14 derniers jours)</div>
                <div class="card-body"><canvas id="graphiqueOuvertures" height="80"></canvas></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-bold">Incidents par station</div>
                <div class="card-body"><canvas id="graphiqueStations"></canvas></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-bold">Incidents par type d'équipement</div>
                <div class="card-body"><canvas id="graphiqueTypes"></canvas></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-bold">Note moyenne des prestataires (sur 5)</div>
                <div class="card-body"><canvas id="graphiqueNotes"></canvas></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-bold">Délai moyen de résolution par prestataire (en heures)</div>
                <div class="card-body"><canvas id="graphiqueDelais"></canvas></div>
            </div>
        </div>
    </div>

    <a th:href="@{/accueil}" class="btn btn-secondary my-4">Retour à l'accueil</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const statistiques = {
        stations: /*[[${statistiques.stations}]]*/ [],
        actifsParStation: /*[[${statistiques.actifsParStation}]]*/ [],
        resolusParStation: /*[[${statistiques.resolusParStation}]]*/ [],
        incidentsParType: {
            libelles: /*[[${statistiques.incidentsParType.libelles}]]*/ [],
            valeurs: /*[[${statistiques.incidentsParType.valeurs}]]*/ []
        },
        ouverturesParJour: {
            libelles: /*[[${statistiques.ouverturesParJour.libelles}]]*/ [],
            valeurs: /*[[${statistiques.ouverturesParJour.valeurs}]]*/ []
        },
        notesParPrestataire: {
            libelles: /*[[${statistiques.notesParPrestataire.libelles}]]*/ [],
            valeurs: /*[[${statistiques.notesParPrestataire.valeurs}]]*/ []
        },
        delaisResolutionParPrestataire: {
            libelles: /*[[${statistiques.delaisResolutionParPrestataire.libelles}]]*/ [],
            valeurs: /*[[${statistiques.delaisResolutionParPrestataire.valeurs}]]*/ []
        }
    };
</script>
<script th:src="@{/js/statistiques.js}"></script>

</body>
</html>
