<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="champ" class="mb-3">
    <label for="description" class="form-label fw-bold">Description de la panne</label>
    <textarea id="description" rows="4" class="form-control" th:field="*{description}"
              th:errorclass="is-invalid"></textarea>
    <div class="invalid-feedback" th:errors="*{description}">Message d'erreur</div>
</div>

</body>
</html>
