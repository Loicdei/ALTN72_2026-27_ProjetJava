<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prestataires - Supervision Équipements</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4">Prestataires</h2>

    <div th:if="${#lists.isEmpty(notesPrestataires)}" class="alert alert-info">Aucun prestataire enregistré.</div>

    <table th:unless="${#lists.isEmpty(notesPrestataires)}" class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Note moyenne</th>
            <th>Évaluations</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="notePrestataire : ${notesPrestataires}">
            <td th:text="${notePrestataire.prestataire.nom}">TechServices</td>
            <td th:text="${notePrestataire.prestataire.email}">contact@techservices.fr</td>
            <td th:text="${notePrestataire.prestataire.telephone}">0140001122</td>
            <td th:text="${notePrestataire.noteMoyenne != null ? #numbers.formatDecimal(notePrestataire.noteMoyenne, 1, 1) + ' / 5' : 'Pas encore évalué'}">4,5 / 5</td>
            <td th:text="${notePrestataire.nombreEvaluations}">2</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/accueil}" class="btn btn-secondary mt-3">Retour à l'accueil</a>
</div>

</body>
</html>
