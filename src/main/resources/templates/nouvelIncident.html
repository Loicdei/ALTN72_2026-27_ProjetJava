<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Déclarer un incident - Supervision Équipements</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-3">Déclarer un incident</h2>

    <p class="text-muted">
        Équipement :
        <strong th:text="${equipement.reference + ' - ' + equipement.libelle}">EQ-001 - Borne de validation</strong>
        (<span th:text="${equipement.station.nom}">Station</span>)
    </p>

    <form th:action="@{/equipements/{id}/incidents(id=${equipement.id})}" th:object="${formulaireIncident}"
          method="post" novalidate>
        <div th:replace="~{champDescription :: champ}"></div>

        <button type="submit" class="btn btn-primary">Déclarer l'incident</button>
        <a th:href="@{/equipements/{id}(id=${equipement.id})}" class="btn btn-secondary">Annuler</a>
    </form>
</div>

</body>
</html>
