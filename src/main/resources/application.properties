spring.application.name=TpFilRouge

# L'hebergeur impose son port via PORT et termine le HTTPS devant l'application.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://localhost:3306/ALTN72_projet_java
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.error.include-message=always

# La documentation ne décrit que l'API, et pas les contrôleurs qui renvoient des pages.
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
